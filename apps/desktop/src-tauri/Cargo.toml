[package]
name = "cc-desktop"
version = "0.1.0"
description = "514cc Console desktop shell (Tauri 2) — auto-starts the control-center kernel and opens it in a native window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auto-launch = "0.5"
dunce = "1.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "2"

# 桌宠浮窗的整窗透明度（「鼠标移入自动隐藏」与环形菜单的透明度档位）。
# Tauri 2.11 的 WebviewWindow 没有 set_opacity，必须直接调 Win32。
# 用 windows-sys 而不是 windows：edition 2021 下裸 unsafe fn 无需 unsafe 块，
# 而且我们只要 SetLayeredWindowAttributes + GetWindowLongPtrW 两个符号。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
