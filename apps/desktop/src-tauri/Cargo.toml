[package]
name = "cc-desktop"
version = "0.1.0"
description = "514cc Console desktop shell (Tauri 2) — auto-starts the control-center kernel and opens it in a native window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auto-launch = "0.5"
dunce = "1.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
