    function statusMarkup(status) {

s="quiet blue">打开验证记录</button></div></div>`;

    }
    function navigate(hash) { if (location.hash === hash) renderRoute(); else location.hash = hash; }
    function closeDetail(restore=true) {
      $('inspector').hidden = true; $('app').classList.remove('has-detail'); $('detail-button').setAttribute('aria-expanded','false');
      if (restore) { if (detailReturn?.isConnected) detailReturn.focus(); else $('detail-button').focus(); }
    }
    function openDetail(title,body) { detailReturn = document.activeElement; $('detail-title').textContent = title; renderMarkup($('detail-body'),body); $('inspector').hidden = false; $('app').classList.add('has-detail'); $('detail-button').setAttribute('aria-expanded','true'); $('close-detail').focus(); }
    function renderSettings() {
      const entry = currentConfig();
      renderMarkup($('settings-pane'),`<div class="settings-heading"><h1>模型与连接</h1><p class="muted">本机 / 项目级配置 / 示例环境</p></div><div class="settings-layout"><div class="connections" aria-label="连接对象">${['codex','claude'].map((id) => `<button data-connection="${id}" aria-pressed="${id === connection}"><span class="avatar ${id}">${brandIcon(id)}</span><span>${id === 'codex' ? 'Codex' : 'Claude'}<small>本地 CLI 连接</small></span></button>`).join('')}</div><form id="config-form"><div class="config-context row between wrap"><h2>${connection === 'codex' ? 'Codex' : 'Claude'} 本地连接</h2><span class="status neutral">${icon('lock')}示例 · 无凭据</span></div><label class="field">连接名称<input id="config-name" value="${escapeHtml(entry.name)}" required maxlength="80"></label><label class="field">默认模型<select id="config-model">${['继承 CLI 默认','性能优先','成本优先'].map((value) => `<option ${entry.model === value ? 'selected' : ''}>${value}</option>`).join('')}</select></label><label class="field">配置目标<input value="本机 / 514cc / 仅此项目" readonly></label><label class="row small"><input type="checkbox" id="config-enabled" ${entry.enabled ? 'checked' : ''}>用于新的项目执行</label><div id="config-status" class="save-state" role="status"></div><div class="config-actions"><button type="submit" class="primary">保存示例配置</button><button type="button" id="activate-config">应用到示例环境</button></div></form></div>`);
      configStatus();
    }
    function configStatus() { const entry = currentConfig(); $('config-status').textContent = entry.dirty ? '有未保存更改' : entry.active ? '示例配置已生效 · 正式配置未修改' : entry.saved ? '已保存 · 尚未生效' : '未保存 · 未连接真实 CLI'; $('activate-config').disabled = !entry.saved || entry.dirty || entry.active; }
    function renderAux() {
      renderMarkup($('aux-pane'),view === 'records' ? `<h1>工作记录</h1><div class="record-row"><div class="row between wrap"><h2>统一项目与工作对话入口</h2><span class="status warn">待审阅 · 示例</span></div><p>514cc / 3 个文件 / 聚焦验证</p><button data-conversation="review" class="quiet blue">打开工作对话 ${icon('chevron-right')}</button></div><div class="record-row"><h2>梳理交付证据与验收边界</h2><p>514cc / 文档成果 / 外部来源待核验</p><button data-conversation="research" class="quiet blue">查看文档成果 ${icon('chevron-right')}</button></div>` : `<h1>自动化</h1><div class="record-row"><div class="row between wrap"><h2>每周项目回顾</h2><span class="status neutral">${icon('clock')}未启用 · 示例</span></div><p>每周一 09:00 / 514cc / 只读核对</p><button data-action="automation-details" class="quiet blue">查看执行范围 ${icon('chevron-right')}</button></div>`);
    }
    function renderRoute() {
      if (view === 'work' && $('work-content').innerHTML) offsets.set(`${selected}/${tab}`,$('work-scroll').scrollTop);
      const [route,id,section,state] = location.hash.slice(1).split('/');
      view = ['settings','records','automations'].includes(route) ? route : 'work';
      if (view === 'work') {
        selected = conversations.some((row) => row.id === id) ? id : conversations[0].id;
        tab = ['conversation','process','results'].includes(section) ? section : 'conversation';
        issue = ['approval','failed','offline','unauthorized','long'].includes(state) ? state : '';
        lastWorkHash = `#work/${selected}/${tab}${issue ? '/'+issue : ''}`;
      }
      closeDetail(false);
      $('app').classList.remove('show-list');
      $('work-layout').hidden = view !== 'work'; $('settings-pane').hidden = view !== 'settings'; $('aux-pane').hidden = !['records','automations'].includes(view);
      $('context-name').textContent = view === 'settings' ? '设置' : view === 'records' ? '记录' : view === 'automations' ? '自动化' : '514cc';
      $('detail-button').hidden = view !== 'work'; $('attention-button').hidden = view !== 'work';
      const status = statusMarkup(view === 'work' && ['offline','unauthorized'].includes(issue) ? issue : 'empty');
      $('connection-status').className = `status context-status ${status.tone}`;
      renderMarkup($('connection-status'),view === 'work' && ['offline','unauthorized'].includes(issue) ? status.html : icon('lock')+'示例环境');
      $('scenario').value = view === 'settings' ? 'settings' : issue || (selected.startsWith('draft-') ? 'empty' : current().status === 'review' || current().status === 'accepted' ? 'review' : 'running');
      renderSidebar();
      if (view === 'work') renderWork(); else if (view === 'settings') renderSettings(); else renderAux();
      persist();
    }
    function ask(title,description,acceptLabel,action) {
      const returnTo = document.activeElement;
      $('confirm-title').textContent = title; $('confirm-description').textContent = description; $('confirm-accept').textContent = acceptLabel;
      $('confirm-accept').onclick = () => { $('confirm-dialog').close(); action(); if (returnTo?.isConnected && !returnTo.disabled) returnTo.focus(); };
      $('confirm-dialog').showModal(); $('confirm-cancel').focus();
    }
    function newConversation() { if (conversations.length >= 23) { notify('示例工作对话已达上限'); return; } const item = {id:`draft-${Date.now()}`,title:'新工作对话',status:'empty',draft:'',messages:[],attachments:[]}; conversations.push(item); persist(); navigate(`#work/${item.id}/conversation`); }
    $('scenario').addEventListener('change', (event) => {
      const scene = event.target.value;
      if (scene === 'settings') navigate('#settings');
      else if (scene === 'empty') newConversation();
      else if (scene === 'review') { conversations[1].status = 'review'; navigate('#work/review/results'); }
      else { conversations[0].status = 'running'; navigate(`#work/running/conversation${scene !== 'running' ? '/'+scene : ''}`); }
    });
    $('theme-button').onclick = () => { setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); persist(); };
    $('search').oninput = renderSidebar;
    $('new-conversation').onclick = newConversation;
    $('menu-button').onclick = () => { $('app').classList.add('show-list'); $('search').focus(); };
    $('prompt').oninput = () => { current().draft = $('prompt').value; persist(); updateSubmit(); };
    $('recipient').onchange = () => { current().recipient = $('recipient').value; persist(); };
    $('attach-button').onclick = () => $('file-input').click();
    $('file-input').onchange = () => { current().attachments = [...(current().attachments || []), ...Array.from($('file-input').files).map((file) => file.name)].slice(0,5); $('file-input').value = ''; persist(); renderWork(); notify('示例附件已列入 · 未上传文件内容'); };
    $('composer').onsubmit = (event) => { event.preventDefault(); if ($('send-button').disabled) return; const item = current(); item.messages.push(item.draft.trim()); if (item.status === 'empty' && item.title === '新工作对话') item.title = item.draft.trim().slice(0,42); item.draft=''; item.attachments=[]; persist(); renderWork(); renderSidebar(); $('work-scroll').scrollTop=$('work-scroll').scrollHeight; $('prompt').focus(); notify('示例输入已接收 · 未启动真实执行'); };
    $('runtime-button').onclick = () => { const preferences=current().runtime || {}; $('model').value=preferences.model || '继承成员默认'; $('effort').value=preferences.effort || '高'; $('budget').value=preferences.budget || 2; $('runtime-dialog').showModal(); };
    $('save-runtime').onclick = () => { if (!$('budget').reportValidity()) return; current().runtime={model:$('model').value,effort:$('effort').value,budget:$('budget').value}; persist(); $('runtime-dialog').close(); $('runtime-button').focus(); notify('示例运行设置已保存'); };
    $('confirm-cancel').onclick = () => $('confirm-dialog').close();
    $('stop-button').onclick = () => ask('停止当前示例执行？','已生成的示例消息和输入草稿会保留。此操作不终止任何真实进程。','停止示例执行',()=>{current().status='paused';issue='';persist();navigate(`#work/${selected}/${tab}`);});
    $('detail-button').onclick = () => { if (!$('inspector').hidden) closeDetail(); else openDetail('工作详情',`<h3>当前目标</h3><p>${escapeHtml(current().title)}</p><dl class="definition"><dt>项目</dt><dd>514cc</dd><dt>工作对话</dt><dd>${escapeHtml(current().id)}</dd><dt>执行</dt><dd>示例快照，不对应真实 Run</dd><dt>权限</dt><dd>仅工作区</dd><dt>成果状态</dt><dd>未发布</dd></dl>`); };
    $('close-detail').onclick = () => closeDetail();
    $('attention-button').onclick = () => { const pending = ['approval','failed','offline','unauthorized'].includes(issue); openDetail('待处理事项',pending ? alertMarkup() : `<h3>${current().status === 'review' ? '1 项成果待审阅' : '暂无阻塞事项'}</h3><p>当前工作对话：${escapeHtml(current().title)}</p><button data-action="show-results">查看成果</button>`); };
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !document.querySelector('dialog[open]')) { if (!$('inspector').hidden) closeDetail(); else if ($('app').classList.contains('show-list')) { $('app').classList.remove('show-list'); $('menu-button').focus(); } }
      const focused = event.target.closest('[data-tab]');
      if (focused && ['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) { event.preventDefault(); const tabs=Array.from(document.querySelectorAll('[data-tab]')); const index=tabs.indexOf(focused); const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length; const destination=tabs[next]; navigate(`#work/${selected}/${destination.dataset.tab}${issue?'/'+issue:''}`); destination.focus(); }
    });
    document.addEventListener('click', (event) => {
      const target=event.target.closest('button'); if (!target) return;
      if (target.dataset.nav) navigate(target.dataset.nav==='work'?lastWorkHash:`#${target.dataset.nav}`);
      if (target.dataset.conversation) navigate(`#work/${target.dataset.conversation}/conversation`);
      if (target.dataset.tab) navigate(`#work/${selected}/${target.dataset.tab}${issue?'/'+issue:''}`);
      if (target.dataset.close) $(target.dataset.close).close();
      if (target.dataset.removeAttachment !== undefined) { current().attachments.splice(Number(target.dataset.removeAttachment),1); persist(); renderWork(); $('attach-button').focus(); }
      if (target.dataset.connection) { const next=target.dataset.connection; if (next===connection) return; const change=()=>{connection=next;renderSettings();document.querySelector(`[data-connection="${next}"]`).focus();}; if(currentConfig().dirty) ask('保留未保存更改？','当前连接的草稿会留在此原型中。切换连接不会写入正式配置。','保留并切换',change); else change(); }
      const action=target.dataset.action;
      if (action==='show-process'||action==='show-results') navigate(`#work/${selected}/${action==='show-process'?'process':'results'}${issue?'/'+issue:''}`);
      if (action==='auth-settings') navigate('#settings');
      if (action==='reconnect') { issue=''; navigate(`#work/${selected}/${tab}`); notify('示例连接已恢复 · 未发起真实请求'); }
      if (action==='approve') ask('批准本次示例写入？','仅允许修改 514cc 项目的 public/api.js。此原型不调用审批 API，也不写文件。','批准本次（示例）',()=>{issue='';navigate(`#work/${selected}/conversation`);notify('示例审批已记录 · 未授权真实动作');});
      if (action==='reject') { current().status='paused';issue='';navigate(`#work/${selected}/conversation`);notify('已拒绝本次示例动作'); }
      if (action==='recovery') openDetail('恢复条件',`<h3>上一次执行失败</h3><p>需核对当前目录、有效授权、运行身份与费用上限。不自动重放原请求。</p><dl class="definition"><dt>错误</dt><dd>PROVIDER_TIMEOUT</dd><dt>草稿</dt><dd>已保留</dd><dt>恢复</dt><dd>尚未执行</dd></dl><button data-action="prepare-retry" style="margin-top:24px">准备重试草稿</button>`);
      if (action==='prepare-retry') { closeDetail(false); current().draft='请先核对上次失败后的状态与恢复条件，不重复执行已完成的操作。'; persist();renderWork();$('prompt').focus(); }
      if (action==='failure-log') openDetail('错误记录','<h3>PROVIDER_TIMEOUT</h3><div class="tool-block"><pre>10:24:18  示例连接超时\n原请求未自动重放\n实际 provider：未调用</pre></div>');
      if (action==='diff') openDetail('变更预览',fileDiffMarkup(target.dataset.file));
      if (action==='tests') openDetail('聚焦验证记录','<h3>12 / 12 通过 · 示例</h3><p>代表性测试回执，不是当前工作区验证结果。</p><div class="tool-block"><pre>PASS  project identity\nPASS  conversation routing\nPASS  draft retention\nPASS  history entry\n\n全量回归：未执行\n真实 CLI：未验证\n正式发布：未执行</pre></div>');
      if (action==='review-evidence') openDetail('独立评审记录','<h3>1 项边界补强 · 示例</h3><p>原判断把“生成文件”视为完成。独立核对补充了真实 CLI 续接尚未验证的限制。</p><dl class="definition"><dt>结论</dt><dd>聚焦验证可保留</dd><dt>残余风险</dt><dd>跨入口恢复仍需真实运行证据</dd><dt>发布</dt><dd>未批准</dd></dl>');
      if (action==='document') openDetail('文档预览','<h3>交付证据与验收边界</h3><p>代码：变更、测试与运行结果。</p><p>文档：可编辑产物、渲染与页面核对。</p><p>调研：来源、结论与适用边界。</p><p class="muted">示例摘要 / 外部来源待核验</p>');
      if (action==='accept-review') ask('确认审阅结论？','仍有真实 CLI 续接与全量回归待验证。确认仅记录示例审阅，不提交、不合并、不发布。','确认审阅（示例）',()=>{current().status='accepted';persist();renderWork();$('tab-results').focus();});
      if (action==='revise') { current().draft='请继续补齐真实 CLI 续接与全量回归的验证证据，并保留当前变更。';persist();navigate(`#work/${selected}/conversation`);setTimeout(()=>$('prompt').focus(),0); }
      if (action==='automation-details') ask('每周项目回顾','范围：读取当前项目的工作记录与成果。没有启用调度器，也没有创建任何自动化。','关闭',()=>{});
    });
    $('settings-pane').addEventListener('input',(event)=>{ if(!event.target.closest('#config-form'))return;$('config-name').setCustomValidity('');const entry=currentConfig();entry.name=$('config-name').value;entry.model=$('config-model').value;entry.enabled=$('config-enabled').checked;entry.dirty=true;entry.active=false;persist();configStatus(); });
    $('settings-pane').addEventListener('submit',(event)=>{event.preventDefault();const entry=currentConfig();if(!entry.name.trim()){$('config-name').setCustomValidity('连接名称不能为空');$('config-name').reportValidity();return;}$('config-name').setCustomValidity('');entry.saved=true;entry.dirty=false;entry.active=false;persist();configStatus();});
    $('settings-pane').addEventListener('click',(event)=>{if(!event.target.closest('#activate-config'))return;const entry=currentConfig();if(!entry.saved||entry.dirty)return;entry.active=true;persist();configStatus();});
    function resizeSidebar(value) { const width=Math.max(220,Math.min(340,Math.round(value)));document.documentElement.style.setProperty('--sidebar-width',`${width}px`);$('splitter').setAttribute('aria-valuenow',width); }
    $('splitter').addEventListener('pointerdown',(event)=>{if(event.button!==0)return;event.preventDefault();$('splitter').setPointerCapture(event.pointerId);});
    $('splitter').addEventListener('pointermove',(event)=>{if($('splitter').hasPointerCapture(event.pointerId))resizeSidebar(event.clientX);});
    $('splitter').addEventListener('pointerup',(event)=>{if($('splitter').hasPointerCapture(event.pointerId))$('splitter').releasePointerCapture(event.pointerId);persist();});
    $('splitter').addEventListener('keydown',(event)=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const width=Number($('splitter').getAttribute('aria-valuenow'));resizeSidebar(event.key==='Home'?220:event.key==='End'?340:width+(event.key==='ArrowRight'?10:-10));persist();});
    window.addEventListener('hashchange',renderRoute);
    window.addEventListener('pagehide',()=>{if(view==='work')offsets.set(`${selected}/${tab}`,$('work-scroll').scrollTop);persist();});
    hydrateIcons();setTheme(saved.theme==='dark'?'dark':'light');resizeSidebar(Number(saved.width)||256);renderRoute();
  </script>
</body>
</html>
